services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
      FRONTEND_URL: "http://localhost:3000"
      HF_TOKEN: "${HF_TOKEN}"
      HF_MODEL: "${HF_MODEL:-HuggingFaceH4/zephyr-7b-beta}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # A URL pública da API é definida em build-time para o Next.js
        NEXT_PUBLIC_API_URL: "http://localhost:3001"
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
